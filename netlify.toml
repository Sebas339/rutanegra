[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/auth"
  status = 200

# Netlify DB (Postgres) se vincula al sitio y Netlify inyecta DATABASE_URL
# automáticamente en el runtime de la Function. No se agrega aqui.
#
# Recomendado: definir JWT_SECRET en el panel (Site settings -> Environment variables)
# como variable de produccion. El valor de abajo es solo respaldo de codigo.
[context.production.environment]
  JWT_SECRET = "rn-2026-cambia-este-secreto-en-netlify-9e8f7a6b5c4d3e2f"
